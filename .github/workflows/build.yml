# Baut FritzTVKit (mit Tests) sowie die Mac- und die Apple-TV-App, ohne zu signieren.
# Läuft bei jedem Push und Pull Request auf main und develop sowie von Hand: Releases entstehen
# durch direkte Merges nach main, ein Lauf nur bei Pull Requests würde sie nie prüfen.
name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: FritzTVKit testen
        run: swift test --package-path FritzTVKit

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Mac-App bauen
        run: |
          set -o pipefail
          xcodebuild -project FritzTV.xcodeproj -scheme FritzTV-macOS \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - name: Apple-TV-App bauen (Gerät, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -project FritzTV.xcodeproj -scheme FritzTV-tvOS \
            -destination 'generic/platform=tvOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions
